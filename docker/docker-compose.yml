# Fast, prebuilt HUF local demo setup.
#
# No build step, no `bench init`, no `new-site`, no `install-app`.
# Just pull the prebuilt images and start.
#
# Usage:
#   git clone https://github.com/tridz-dev/huf.git
#   cd huf/docker
#   docker compose up --wait
#
# Then open:
#   http://localhost:8000/huf
#
# The first start restores the seeded site from the SQL seed image.
# Subsequent starts reuse the existing volumes and boot in ~20–30 s.
#
# Override image tags if needed:
#   export HUF_IMAGE_TAG=06655cf
#   export HUF_APP_IMAGE=ghcr.io/tridz-dev/huf-app
#   export SEED_IMAGE=ghcr.io/tridz-dev/huf-site-seed-sql

name: huf

x-frappe-env: &frappe_env
  SITE_NAME: ${SITE_NAME:-huf.localhost}
  FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-huf.localhost}
  DB_HOST: mariadb
  DB_PORT: "3306"
  REDIS_CACHE: redis://redis:6379/0
  REDIS_QUEUE: redis://redis:6379/1
  REDIS_SOCKETIO: redis://redis:6379/2
  FRAPPE_REDIS_CACHE: redis://redis:6379/0
  FRAPPE_REDIS_QUEUE: redis://redis:6379/1
  FRAPPE_REDIS_SOCKETIO: redis://redis:6379/2
  APP_NAME: ${APP_NAME:-huf}
  BENCH_START_PORT: ${BENCH_START_PORT:-8000}
  BENCH_WORKER_QUEUES: ${BENCH_WORKER_QUEUES:-default,short,long}

services:
  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:10.11.11}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-fasterdocker-mysql-root}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - huf

  redis:
    image: ${REDIS_IMAGE:-redis:6.2-alpine}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 2s
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - huf

  seed-init:
    image: ${SEED_IMAGE:-ghcr.io/tridz-dev/huf-site-seed-sql}:${HUF_IMAGE_TAG:-latest}
    environment:
      SEED_STRATEGY: sql
      SITE_NAME: ${SITE_NAME:-huf.localhost}
      DB_HOST: mariadb
      DB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-fasterdocker-mysql-root}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-fasterdocker-admin}
      SEED_SOURCE_DIR: /seed
      SEED_TARGET_DIR: /seed-target
    volumes:
      - sites:/seed-target/sites
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - huf
    command: ["/seed/init-seed.sh"]
    restart: "no"

  frappe:
    image: ${HUF_APP_IMAGE:-ghcr.io/tridz-dev/huf-app}:${HUF_IMAGE_TAG:-latest}
    environment:
      <<: *frappe_env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "${BENCH_WEB_PUBLISH_PORT:-8000}:8000"
      - "${BENCH_SOCKETIO_PUBLISH_PORT:-9000}:9000"
    depends_on:
      seed-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: ${SITE_NAME:-huf.localhost}", "http://localhost:8000/api/method/ping"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - huf
    command: ["/usr/local/bin/bench-start.sh"]

volumes:
  mariadb-data:
  sites:
  logs:
  redis-data:

networks:
  huf:
    driver: bridge
