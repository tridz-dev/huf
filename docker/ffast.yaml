# HUF's ffast config: a reference description of the demo variant (app, site,
# image, ports, container prefix). It documents the settings that
# docker/docker-compose.yml, docker/fast/demo-entrypoint.sh, docker/try.sh and
# docker/fast/.env.example were written against.
#
# ffast is a generator that has not been published yet: there is no package to
# install and nothing consumes this file today. Treat it as a reference config
# only; the checked-in docker/ files are hand-maintained and are the source of
# truth. The bench/fast/fast-physical variants are not described here.
app_name: huf
site_name: huf.localhost
image_registry: ghcr.io
image_repository: tridz-dev/huf-demo
image_tag: latest
container_prefix: fasterdocker-run
ports:
  web: 8000
  socketio: 9000
  frontend: 8080
mariadb_image: mariadb:10.11.11
project_name: huf
output_directory: ./docker
