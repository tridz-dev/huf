<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<meta name="csrf-token" content="{{ csrf_token or '' }}" />
<title>Opening</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);text-align:center}
#msg{margin:48px 0 18px;font-size:17px;line-height:1.4;color:var(--tg-theme-text-color,#111)}
#retry{font-size:17px;padding:10px 28px;border:0;border-radius:10px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}
#retry:focus-visible{outline:2px solid var(--tg-theme-link-color,#2481cc);outline-offset:2px}
[hidden]{display:none}
</style>
</head>
<body>
<div id="msg" role="status" aria-live="polite">Signing you in...</div>
<button id="retry" type="button" hidden>Retry</button>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var msg = document.getElementById("msg"), retry = document.getElementById("retry");
  var params = new URLSearchParams(location.search);
  var gw = params.get("gw") || "", to = params.get("to") || "";
  var DENIED = "Not authorized. Ask your administrator.";
  var NO_INIT = "Open this link from the Telegram app.";
  var WEB = "Telegram Web cannot keep a sign-in here. Open this in the Telegram app on your phone or desktop.";
  function show(text, alert, canRetry) {
    msg.textContent = text;
    msg.setAttribute("role", alert ? "alert" : "status");
    msg.setAttribute("aria-live", alert ? "assertive" : "polite");
    retry.hidden = !canRetry;
  }
  function safeRedirect(p) {
    return typeof p === "string" && p.charAt(0) === "/" && p.charAt(1) !== "/" && p.charAt(1) !== "\\" && !/[\r\n]/.test(p);
  }
  function csrfHeaders() {
    var h = {"Content-Type": "application/json", "Accept": "application/json"};
    var m = document.querySelector('meta[name="csrf-token"]');
    var t = m && m.getAttribute("content");
    if (t) { h["X-Frappe-CSRF-Token"] = t; }
    return h;
  }
  function run() {
    if (!tg || !tg.initData) { show(NO_INIT, true, false); return; }
    var embedded = false;
    try { embedded = window.top !== window; } catch (e) { embedded = true; }
    if (embedded || ["weba", "webk", "web"].indexOf(tg.platform) !== -1) { show(WEB, true, false); return; }
    show("Signing you in...", false, false);
    fetch("/api/method/huf.ai.telegram_web_access.exchange", {
      method: "POST", credentials: "same-origin",
      headers: csrfHeaders(),
      body: JSON.stringify({init_data: tg.initData, gateway: gw, to: to})
    }).then(function (r) {
      if (!r.ok) { throw new Error("denied"); }
      return r.json();
    }).then(function (j) {
      var d = j && (j.message && typeof j.message === "object" ? j.message : j);
      if (d && d.ok === true && safeRedirect(d.redirect)) { location.replace(d.redirect); return; }
      throw new Error("denied");
    }).catch(function () { show(DENIED, true, true); });
  }
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try {
      var tp = tg.themeParams || {}, root = document.documentElement.style;
      Object.keys(tp).forEach(function (k) {
        if (/^[a-z_]+$/.test(k) && /^#[0-9a-fA-F]{3,8}$/.test(String(tp[k]))) {
          root.setProperty("--tg-theme-" + k.replace(/_/g, "-"), tp[k]);
        }
      });
    } catch (e) {}
  }
  retry.addEventListener("click", run);
  run();
})();
</script>
</body>
</html>
