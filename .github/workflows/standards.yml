name: Standards

on:
  pull_request:
  push:
    branches: [develop, pre-develop]

permissions:
  contents: read

jobs:
  standards:
    name: Standards · guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard script tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Run standards guards
        run: python3 scripts/run_standards.py
