name: Publish FasterDocker images

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      huf_image_tag:
        description: 'Tag for HUF demo image (e.g. 06655cf or v0.11.0)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  HUF_DEMO_IMAGE: ghcr.io/tridz-dev/huf-demo

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "huf_tag=${{ github.event.inputs.huf_image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "huf_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push HUF demo image
        env:
          HUF_IMAGE_TAG: ${{ steps.tags.outputs.huf_tag }}
          HUF_DEMO_IMAGE: ${{ env.HUF_DEMO_IMAGE }}
        run: |
          set -euo pipefail
          ./docker/fast/build-demo.sh
          docker tag "huf-demo:${HUF_IMAGE_TAG}" "${HUF_DEMO_IMAGE}:${HUF_IMAGE_TAG}"
          docker tag "huf-demo:${HUF_IMAGE_TAG}" "${HUF_DEMO_IMAGE}:latest"
          docker push "${HUF_DEMO_IMAGE}:${HUF_IMAGE_TAG}"
          docker push "${HUF_DEMO_IMAGE}:latest"
